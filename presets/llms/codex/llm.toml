cmd = "codex"
loop_cmd = 'codex exec resume --json --dangerously-bypass-approvals-and-sandbox --skip-git-repo-check {session_id} "$(cat /renkin-conf/bot_prompt.md)"'
restart_policy = "always"
restart_delay = 2
log_dir = ".renkin/logs"
stdout_log = "stdout.log"
stderr_log = "stderr.log"
install = """
RUN apt-get update && apt-get install -y curl ca-certificates git python3 && \
    curl -fsSL https://deb.nodesource.com/setup_24.x | bash - && \
    apt-get install -y nodejs && \
    npm install -g @openai/codex && \
    git config --global --add safe.directory /workspace
"""
skill_file = "AGENTS.md"
env_keys = ["OPENAI_API_KEY"]
default_env = ["CODEX_TRUST_WORKSPACE=true"]
runtime_configs = [
    { source = "config.toml", target = "/root/.codex/config.toml" }
]
home_mounts = [
    { host_dir = ".renkin/codex", container_dir = "/root/.codex" }
]
