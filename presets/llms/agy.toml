cmd = "agy"
install = """
RUN apt-get update && apt-get install -y curl ca-certificates git python3 && \
    curl -fsSL https://antigravity.google/cli/install.sh | bash && \
    mv /root/.local/bin/agy /usr/local/bin/agy && \
    git config --global --add safe.directory /workspace
"""
skill_file = "GEMINI.md"
env_keys = ["GEMINI_API_KEY"]
default_env = ["GEMINI_TRUST_WORKSPACE=true"]
runtime_configs = [
    { source = "mcp_config.json", target = "/root/.gemini/config/mcp_config.json" }
]
home_mounts = [
    { host_dir = ".renkin/gemini", container_dir = "/root/.gemini" }
]
